<div class="login-page">

    <a routerLink="/" class="back-home">

        <i class="fa-solid fa-arrow-left"></i>

        Back Home

    </a>

    <div class="login-card">

        <img
            src="/img/logo.png"
            class="logo"
            alt="PRAS">

        <h2>Welcome Back</h2>

        <p>

            Sign in to continue to PRAS Dashboard

        </p>

        <form (ngSubmit)="login()">

            <div class="form-group">

                <label>Email Address</label>

                <input
                    type="email"
                    [(ngModel)]="email"
                    name="email"
                    placeholder="Enter your email"
                    required>

            </div>

            <div class="form-group">

                <label>Password</label>

                <div class="password-box">

                    <input

                        [type]="hidePassword ? 'password' : 'text'"

                        [(ngModel)]="password"

                        name="password"

                        placeholder="Enter password"

                        required>

                    <button
                        type="button"
                        (click)="togglePassword()">

                        <i

                        class="fa-solid"

                        [class.fa-eye]="hidePassword"

                        [class.fa-eye-slash]="!hidePassword">

                        </i>

                    </button>

                </div>

            </div>

            <div class="options">

                <label>

                    <input
                        type="checkbox"
                        [(ngModel)]="remember"
                        name="remember">

                    Remember me

                </label>

                <a routerLink="/forgot-password">

                    Forgot Password?

                </a>

            </div>

            <button
                class="login-btn">

                Sign In

            </button>

        </form>

    </div>

    <small>

        © 2026 PRAS

    </small>

</div>
